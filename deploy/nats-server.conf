# Template of the nats-server configuration (docs/design/jetstream-binding.md). deploy/nats.sh fills in the ${...}
# placeholders and writes the result to $BUS_CONFIG_DIR/nats/nats-server.conf. The users and their
# permissions are not here: `agent-busctl admin init` generates auth.conf (BUS) and control-auth.conf
# (CONTROL) next to the rendered file, and agent-busctl rewrites auth.conf when access changes.

server_name: agent-bus
listen: "${BUS_LISTEN_IP}:${BUS_NATS_PORT}"

# The monitoring endpoint stays on this machine: agent-busctl confirms reloads through it.
http: "127.0.0.1:${BUS_MONITOR_PORT}"

# The client listener is a TLS one and logs in with a password; a plaintext client is refused.
tls {
  cert_file: "${BUS_CONFIG_DIR}/broker.pem"
  key_file: "${BUS_CONFIG_DIR}/broker.key"
  timeout: 5
}

# The mapped listener, for certificate logins (docs/design/access-control.md). nats-server allows one verify_and_map
# per listener and then requires a client certificate from every client of it, so certificate
# users cannot share the password listener above. A second client port does not exist; the
# WebSocket listener is the second TLS listener, and nats.go reaches it with a wss:// address.
# verify_and_map maps the certificate's URI SAN to the user of that name; auth.conf lets only
# this listener log those users in (allowed_connection_types).
websocket {
  host: "${BUS_LISTEN_IP}"
  port: ${BUS_MAPPED_PORT}
  tls {
    cert_file: "${BUS_CONFIG_DIR}/broker.pem"
    key_file: "${BUS_CONFIG_DIR}/broker.key"
    ca_file: "${BUS_CONFIG_DIR}/ca.pem"
    verify_and_map: true
    timeout: 5
  }
}

jetstream {
  store_dir: "${BUS_DATA_DIR}"
}

# Two accounts with nothing shared: agents live in BUS and cannot reach what is in CONTROL.
accounts {
  BUS {
    jetstream: enabled
    include auth.conf
  }
  CONTROL {
    jetstream: enabled
    include control-auth.conf
  }
}
