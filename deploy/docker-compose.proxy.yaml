# Overlay: Caddy in front of the web monitor. Only Caddy publishes the monitor; the broker keeps its
# port. Use it on top of docker-compose.yaml (docs/monitor.md, "Behind a reverse proxy"):
#
#   docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.proxy.yaml --profile monitor up -d
#
# Needs Docker Compose 2.24 or newer (`!override`). Before the first start set the password:
#   docker compose -f deploy/docker-compose.yaml exec -it agent-bus agent-busctl monitor password
#
# BUS_PUBLIC_HOST   the host name clients use, for Caddy's certificate (default: localhost, a local CA)
# BUS_PUBLIC_URL    how clients reach Caddy, e.g. https://bus.example (default: https://localhost)
# BUS_HTTPS_PORT    host port for 443 (default: 443); BUS_HTTP_PORT likewise for 80 (default: 80)
services:
  agent-bus:
    ports: !override
      - "4222:4222"

  monitor:
    environment:
      BUS_WEB_BEHIND_PROXY: "true"
      BUS_WEB_PUBLIC_URL: ${BUS_PUBLIC_URL:-https://localhost}
      # Caddy's address is in this subnet (see the network below); it tells the monitor who the client is.
      BUS_WEB_TRUSTED_PROXY: 172.29.0.0/24

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${BUS_HTTP_PORT:-80}:80"
      - "${BUS_HTTPS_PORT:-443}:443"
    environment:
      BUS_PUBLIC_HOST: ${BUS_PUBLIC_HOST:-localhost}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - monitor
    profiles: ["monitor"]

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  caddy-data:
