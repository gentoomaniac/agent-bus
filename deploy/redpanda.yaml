# Redpanda broker for the agent bus, as a Kubernetes Pod manifest.
#
# It is a template: deploy/broker.sh fills in the ${BUS_*} variables (envsubst) and starts it with
# `podman kube play`. Any runtime that understands these objects can start it the same way, with
# the same variables filled in:
#   BUS_POD_NAME         name of the pod and prefix of its data volume
#   BUS_CONFIG_DIR       host directory holding broker.pem, broker.key and admin/password
#   BUS_KAFKA_PORT       Kafka port, listened on and published on the host
#   BUS_LISTEN_IP        host address the port is published on (0.0.0.0: all interfaces)
#   BUS_ADVERTISE_HOST   host name clients reach the broker under; must be in the certificate's SANs
#
# The broker has one listener: TLS and SASL/SCRAM. Topic auto-creation is off and ACLs are enforced.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${BUS_POD_NAME}-config
data:
  redpanda.yaml: |
    redpanda:
      data_directory: /var/lib/redpanda/data
      node_id: 0
      seed_servers: []
      kafka_api:
        - name: tls
          address: "::"
          port: ${BUS_KAFKA_PORT}
          authentication_method: sasl
      advertised_kafka_api:
        - name: tls
          address: ${BUS_ADVERTISE_HOST}
          port: ${BUS_KAFKA_PORT}
      kafka_api_tls:
        - name: tls
          enabled: true
          cert_file: /run/bus/broker.pem
          key_file: /run/bus/broker.key
          require_client_auth: false
  # Cluster properties, applied when the cluster is first bootstrapped. The admin user itself is
  # created from RP_BOOTSTRAP_USER (see the container command).
  .bootstrap.yaml: |
    superusers: [admin]
    sasl_mechanisms: [SCRAM]
    kafka_enable_authorization: true
    auto_create_topics_enabled: false
    default_topic_replications: 1
    # Consumer group offsets never expire: agents may be offline for a long time (design.md §4).
    group_offset_retention_sec: null
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${BUS_POD_NAME}-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ${BUS_POD_NAME}
  annotations:
    # The image runs as uid 101; this makes it able to read the 0600 key files of the host user.
    io.podman.annotations.userns: keep-id:uid=101,gid=101
spec:
  containers:
    - name: redpanda
      image: docker.io/redpandadata/redpanda:v26.1.21
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          cp /run/bus/config/redpanda.yaml /run/bus/config/.bootstrap.yaml /etc/redpanda/
          export RP_BOOTSTRAP_USER="admin:$(cat /run/bus/admin-password)"
          exec rpk redpanda start --check=false --overprovisioned --smp 1 --memory 1G --reserve-memory 0M
      ports:
        - containerPort: ${BUS_KAFKA_PORT}
          hostPort: ${BUS_KAFKA_PORT}
          hostIP: ${BUS_LISTEN_IP}
      volumeMounts:
        - { name: data, mountPath: /var/lib/redpanda/data }
        - { name: config, mountPath: /run/bus/config, readOnly: true }
        - { name: broker-cert, mountPath: /run/bus/broker.pem, readOnly: true }
        - { name: broker-key, mountPath: /run/bus/broker.key, readOnly: true }
        - { name: admin-password, mountPath: /run/bus/admin-password, readOnly: true }
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ${BUS_POD_NAME}-data
    - name: config
      configMap:
        name: ${BUS_POD_NAME}-config
    - name: broker-cert
      hostPath: { path: "${BUS_CONFIG_DIR}/broker.pem", type: File }
    - name: broker-key
      hostPath: { path: "${BUS_CONFIG_DIR}/broker.key", type: File }
    - name: admin-password
      hostPath: { path: "${BUS_CONFIG_DIR}/admin/password", type: File }
