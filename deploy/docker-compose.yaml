# Example: the central components in one container. See docs/docker.md.
# AGENT_BUS_IMAGE overrides the image, for example agent-messenger:dev from `make image`.
# The state lives in the folders config/, data/ and monitor-config/ next to this file, or in
# AGENT_BUS_HOME if set. Create them first, owned by uid 10001 (the container's user):
#   mkdir -p config data monitor-config && sudo chown 10001 config data monitor-config
services:
  agent-bus:
    image: ${AGENT_BUS_IMAGE:-ghcr.io/gentoomaniac/agent-messenger:latest}
    restart: unless-stopped
    ports:
      - "4222:4222" # passwords
      - "4223:4223" # client certificates
      - "127.0.0.1:8080:8080" # the monitor's page, see the monitor service
    volumes:
      - ${AGENT_BUS_HOME:-.}/config:/config
      - ${AGENT_BUS_HOME:-.}/data:/data
    environment:
      # busd: the monitor's identity acts as the bus owner for channels (docs/docker.md)
      BUSD_BUS_OWNER: ${BUS_AGENT:-}
    #   BUS_LISTEN_IP: 0.0.0.0
    #   BUS_NATS_PORT: 4222
    #   BUS_MAPPED_PORT: 4223
    #   BUS_MONITOR_PORT: 8222


  # Optional: the web monitor (docs/monitor.md). It shares the broker's network, so it reaches the
  # broker as localhost, and has a config folder of its own: no CA key, no admin login, only its
  # read-only logins (fill it with the monitor-init service, below). The page shows all traffic: set
  # its password first (`agent-busctl monitor password` in the agent-bus container) and publish it on the
  # host's loopback only. It listens on 0.0.0.0 in the container, so it needs --behind-proxy, which
  # insists on the password. To publish it through a TLS proxy, see docker-compose.proxy.yaml.
  monitor:
    image: ${AGENT_BUS_IMAGE:-ghcr.io/gentoomaniac/agent-messenger:latest}
    entrypoint: ["bus-monitor"]
    restart: unless-stopped
    network_mode: "service:agent-bus"
    depends_on:
      - agent-bus
    volumes:
      - ${AGENT_BUS_HOME:-.}/monitor-config:/config
    environment:
      BUS_WEB_LISTEN: 0.0.0.0:8080
      BUS_WEB_BEHIND_PROXY: "true"
      BUS_AGENT: ${BUS_AGENT:-}   # an identity registered with agent-busctl, to send as (empty: read-only)
    profiles: ["monitor"]

  # Fills and refreshes the monitor's config folder from the broker's, which it reads only:
  #   docker compose -f deploy/docker-compose.yaml run --rm monitor-init
  # Run it again after changing the web password, the monitor's sending key or the CA; new agents
  # reach the monitor through busd without it.
  monitor-init:
    image: ${AGENT_BUS_IMAGE:-ghcr.io/gentoomaniac/agent-messenger:latest}
    entrypoint: ["agent-busctl", "monitor", "init", "/monitor-config"]
    environment:
      BUS_AGENT: ${BUS_AGENT:-} # the identity to send as, copied with its key
    volumes:
      - ${AGENT_BUS_HOME:-.}/config:/config:ro
      - ${AGENT_BUS_HOME:-.}/monitor-config:/monitor-config
    profiles: ["monitor-init"]
