# nginx in front of the web monitor: it does the TLS (docs/monitor.md). Put this in a server context
# next to your certificate. Start the monitor with
#   bus-monitor --behind-proxy --public-url https://bus.example
# and, if nginx is not on the monitor's loopback, --trusted-proxy <nginx address>.

# Redirect plain HTTP.
server {
    listen 80;
    server_name bus.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bus.example;

    ssl_certificate     /etc/ssl/bus.example/fullchain.pem;
    ssl_certificate_key /etc/ssl/bus.example/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;

        # The monitor compares Host with the public URL, so pass it on unchanged.
        proxy_set_header Host $host;
        # The monitor reads the last X-Forwarded-For entry, the one nginx adds, and believes these
        # headers only from its --trusted-proxy addresses.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The event stream (GET /api/v1/events): HTTP/1.1, no buffering, and a long read timeout. The
        # monitor sends a keep-alive every 15 seconds, so 1h is only a bound for a silent upstream.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
