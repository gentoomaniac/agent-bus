# nginx in front of the web monitor: it does the TLS (docs/docker.md#publish-the-monitor-through-a-tls-proxy,
# docs/monitor.md). Used as it is by the nginx service of docker-compose.proxy.yaml, mounted as
# /etc/nginx/conf.d/default.conf. For another setup, change the places marked EDIT.
#
# The monitor must run with
#   BUS_WEB_BEHIND_PROXY=true  BUS_WEB_PUBLIC_URL=https://<host name clients use>
#   BUS_WEB_TRUSTED_PROXY=<nginx's address or network>
# The compose overlay sets all three.

# EDIT 1: where the monitor listens: the compose service name of the broker (the monitor shares its
# network), or 127.0.0.1:8080 for nginx on the same host.
upstream monitor {
    server agent-bus:8080;
}

# Redirect plain HTTP. For a public HTTPS port other than 443 write the port into the target, for
# example https://$host:8443$request_uri.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    # EDIT 2: your host name, if this nginx serves other sites too. "_" takes every name; the monitor
    # itself accepts only the host of its public URL.
    server_name _;

    # EDIT 3: the certificate and its key.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # The monitor compares Host with the public URL, so pass it on unchanged: $http_host keeps the
    # port of a non-standard public URL, $host drops it.
    proxy_set_header Host $http_host;
    # The monitor reads the last X-Forwarded-For entry, the one nginx adds, and believes these
    # headers only from its trusted proxy addresses.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The monitor believes X-Forwarded-Host from this proxy, so never pass on one a client sent.
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://monitor;
    }

    # The live event stream (server-sent events). Without these lines nginx collects the stream and
    # the page only updates after a reload. The monitor sends a keep-alive every 15 seconds, so the
    # long read timeout only bounds a silent upstream.
    location = /api/v1/events {
        proxy_pass http://monitor;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
