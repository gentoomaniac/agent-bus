<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">Agent Bus logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- the bus -->
  <rect x="18" y="61" width="92" height="6" rx="3" fill="url(#line)"/>
  <!-- agents above and below, each a terminal tapped onto the bus -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="38" y1="44" x2="38" y2="61" stroke="#22d3ee"/>
    <line x1="90" y1="44" x2="90" y2="61" stroke="#a78bfa"/>
    <line x1="64" y1="67" x2="64" y2="84" stroke="#67e8f9"/>
  </g>
  <g fill="#0b1120" stroke-width="3">
    <rect x="24" y="20" width="28" height="24" rx="6" stroke="#22d3ee"/>
    <rect x="76" y="20" width="28" height="24" rx="6" stroke="#a78bfa"/>
    <rect x="50" y="84" width="28" height="24" rx="6" stroke="#67e8f9"/>
  </g>
  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M31 28l5 4-5 4M39 37h6" stroke="#22d3ee"/>
    <path d="M83 28l5 4-5 4M91 37h6" stroke="#a78bfa"/>
    <path d="M57 92l5 4-5 4M65 101h6" stroke="#67e8f9"/>
  </g>
  <!-- the signature seal -->
  <circle cx="102" cy="96" r="13" fill="#10b981"/>
  <path d="M96 96.5l4 4 7.5-8" fill="none" stroke="#ecfdf5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
