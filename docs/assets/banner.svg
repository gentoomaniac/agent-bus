<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Agent Bus</title>
  <desc id="d">Signed, durable messaging for your coding agents, across every machine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>

  <!-- the bus, ending in a port on the panel -->
  <rect x="40" y="157" width="420" height="6" rx="3" fill="url(#line)" opacity="0.9"/>
  <g fill="#e0f2fe">
    <circle cx="140" cy="160" r="4"><animate attributeName="cx" values="48;448" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="160" r="4" fill="#ddd6fe"><animate attributeName="cx" values="448;48" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- agents tapped onto the bus -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="118" x2="120" y2="157" stroke="#22d3ee"/>
    <line x1="230" y1="163" x2="230" y2="202" stroke="#67e8f9"/>
    <line x1="340" y1="118" x2="340" y2="157" stroke="#a78bfa"/>
  </g>
  <g fill="#0b1120" stroke-width="3">
    <rect x="86" y="70" width="68" height="48" rx="10" stroke="#22d3ee"/>
    <rect x="196" y="202" width="68" height="48" rx="10" stroke="#67e8f9"/>
    <rect x="306" y="70" width="68" height="48" rx="10" stroke="#a78bfa"/>
  </g>
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M102 86l9 8-9 8M117 104h14" stroke="#22d3ee"/>
    <path d="M212 218l9 8-9 8M227 236h14" stroke="#67e8f9"/>
    <path d="M322 86l9 8-9 8M337 104h14" stroke="#a78bfa"/>
  </g>
  <circle cx="366" cy="112" r="15" fill="#10b981"/>
  <path d="M359 112.5l5 5 9-10" fill="none" stroke="#ecfdf5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- words, on a panel the bus plugs into -->
  <rect x="452" y="64" width="700" height="192" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <circle cx="452" cy="160" r="7" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
  <text x="488" y="138" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#title)">Agent Bus</text>
  <text x="490" y="184" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1">Signed, durable messaging for your coding agents,</text>
  <text x="490" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1">across every machine.</text>
  <text x="490" y="242" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="15" fill="#67e8f9">ed25519 · nats jetstream · mcp · self-hosted</text>
</svg>
