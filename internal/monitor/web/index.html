<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent bus monitor</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --border: #dfe3ea;
    --accent: #3b5bdb; --accent-text: #ffffff; --hover: #eef1f6; --selected: #e3e9fb;
    --ok: #1a7f37; --ok-bg: #dcf5e3; --warn: #8a5a00; --warn-bg: #fff1cc; --bad: #b42318; --bad-bg: #fde4e1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1a1e28; --text: #e6e9f0; --muted: #98a2b3; --border: #2b3140;
      --accent: #7c93f5; --accent-text: #10131a; --hover: #232938; --selected: #2a3350;
      --ok: #6fd48a; --ok-bg: #173424; --warn: #f0c565; --warn-bg: #3a2d10; --bad: #ff8f85; --bad-bg: #3d1a17;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  :root { --sidebar-w: 260px; --members-w: 220px; --handle-w: 6px; }
  #app { display: grid; grid-template-columns: var(--sidebar-w) var(--handle-w) minmax(0, 1fr) var(--handle-w) var(--members-w); height: 100%; }
  #app.sidebar-hidden { --sidebar-w: 0px; }
  #app.members-hidden { --members-w: 0px; }
  aside { min-width: 0; overflow-x: hidden; }
  .handle { background: var(--panel); cursor: col-resize; touch-action: none; position: relative; }
  .handle::after { content: ""; position: absolute; inset: 0 2px; background: var(--border); }
  .handle:hover::after, .handle:focus-visible::after, .handle.dragging::after { background: var(--accent); }
  .handle.collapsed { cursor: default; pointer-events: none; }
  body.resizing { cursor: col-resize; user-select: none; }
  .toggle { padding: 1px 8px; font-size: 12px; background: var(--bg); color: var(--text); border-color: var(--border); }
  .toggle[aria-pressed=false] { color: var(--muted); }
  aside, main { background: var(--panel); min-height: 0; display: flex; flex-direction: column; }
  #sidebar, #members-panel { overflow-y: auto; }
  h1, h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 12px 6px; }
  h1 { margin-top: 12px; color: var(--text); font-size: 14px; text-transform: none; letter-spacing: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.item { padding: 5px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  li.item:hover { background: var(--hover); }
  li.item.selected { background: var(--selected); font-weight: 600; }
  /* Long text is cut with an ellipsis and carries its full text as a tooltip; states never wrap. */
  .cut { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  li.item .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.item .unread { flex: none; }
  li.member { padding: 4px 12px; cursor: pointer; }
  li.member:hover { background: var(--hover); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; flex: none; background: var(--muted); }
  .removed { opacity: .5; }
  .dot.working { background: var(--ok); }
  .dot.idle { background: var(--accent); }
  .dot.waiting_for_owner, .dot.rate_limited { background: var(--warn); }
  .dot.unresponsive, .dot.error { background: var(--bad); }
  .dot.monitor { background: var(--ok); }
  .dot.offline { background: transparent; border: 1px solid var(--muted); }
  li.item > div { flex: 1; min-width: 0; }
  .agent-line { display: flex; align-items: center; min-width: 0; }
  .agent-line .label { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent-line .state { flex: none; padding-left: 6px; white-space: nowrap; }
  .agent-sub { margin-left: 15px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #agent-detail { border-top: 1px solid var(--border); padding-bottom: 12px; }
  #agent-detail .entry { padding: 2px 12px; font-size: 12px; overflow-wrap: anywhere; }
  h2.cut { display: block; }
  .unread { background: var(--accent); color: var(--accent-text); border-radius: 9px; padding: 0 6px; font-size: 11px; }
  .muted { color: var(--muted); }
  .empty { padding: 4px 12px; color: var(--muted); }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  header .title { font-weight: 600; font-size: 16px; }
  header .left > div { min-width: 0; }
  header .left .title, header .left .muted { display: inline-block; max-width: 100%; vertical-align: bottom; }
  #live { font-size: 12px; color: var(--muted); }
  #live.on { color: var(--ok); }
  #messages { flex: 1; overflow-y: auto; padding: 8px 16px; min-height: 0; }
  .message { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .message .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
  .message .meta > * { white-space: nowrap; }
  .message .meta > .cut { max-width: min(30ch, 100%); }
  .message .from { font-weight: 600; }
  .message .title { font-weight: 600; margin-top: 2px; }
  .message .text { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .message .reason { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .pill { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; font-size: 11px; border: 1px solid var(--border); border-radius: 9px; padding: 0 7px; color: var(--muted); }
  .pill.target { color: var(--accent); border-color: var(--accent); }
  .pill.me { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .pill.all { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); font-weight: 600; }
  .targets-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  #targets { flex-wrap: wrap; align-items: center; font-size: 12px; }
  #targets label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; max-width: 30ch; }
  #targets label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #targets input { padding: 0; }
  .badge { font-size: 11px; border-radius: 9px; padding: 0 7px; font-weight: 600; }
  .badge.verified { background: var(--ok-bg); color: var(--ok); }
  .badge.unknown_sender { background: var(--warn-bg); color: var(--warn); }
  .badge.rejected { background: var(--bad-bg); color: var(--bad); }
  form { border-top: 1px solid var(--border); padding: 10px 16px; display: grid; gap: 6px; }
  form .row { display: flex; gap: 6px; }
  form .row > * { min-width: 0; }
  form input[name=title] { flex: 1; }
  select, input, textarea, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
  textarea { width: 100%; resize: vertical; min-height: 56px; }
  button { background: var(--accent); color: var(--accent-text); border-color: var(--accent); cursor: pointer; }
  button:disabled, select:disabled, input:disabled, textarea:disabled { opacity: .55; cursor: not-allowed; }
  #send-note { font-size: 12px; color: var(--muted); }
  #send-note.error { color: var(--bad); }
  [hidden] { display: none !important; }
  #login-screen { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 1; }
  #login-form { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; width: min(320px, 90vw); }
  #login-note { font-size: 12px; color: var(--bad); min-height: 1.4em; }
  #banner { background: var(--warn-bg); color: var(--warn); padding: 4px 16px; font-size: 12px; }
  header .right, header .left { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  header .left { flex: 1; }
  #logout { padding: 1px 8px; font-size: 12px; background: var(--bg); color: var(--text); border-color: var(--border); }
</style>
</head>
<body>
<div id="login-screen" hidden>
  <form id="login-form">
    <h1>Agent bus monitor</h1>
    <input type="password" name="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
    <button type="submit">Log in</button>
    <div id="login-note" role="alert"></div>
  </form>
</div>
<div id="app">
  <aside id="sidebar">
    <h1>Agent bus monitor</h1>
    <h2>Channels</h2><ul id="channels"></ul>
    <h2>Direct messages</h2><ul id="dms"></ul>
    <h2>Agents</h2><ul id="agents"></ul>
  </aside>
  <div class="handle" id="sidebar-handle" role="separator" aria-orientation="vertical" aria-label="Resize the channel list" tabindex="0" title="Drag to resize, double-click to reset"></div>
  <main>
    <div id="banner" hidden>No password set: anyone who can reach this page sees all traffic. Set one with <code>busctl monitor password</code>.</div>
    <header>
      <div class="left">
        <button class="toggle" id="toggle-sidebar" type="button" title="Show or hide the channel list" aria-pressed="true">Channels</button>
        <div><span class="title cut" id="channel-title">Select a channel</span> <span class="muted cut" id="channel-description"></span></div>
      </div>
      <div class="right"><span id="live">connecting...</span><button id="logout" type="button" hidden>Log out</button>
        <button class="toggle" id="toggle-members" type="button" title="Show or hide the members panel" aria-pressed="true">Members</button></div>
    </header>
    <div id="messages"></div>
    <form id="composer">
      <div class="row">
        <select name="target" aria-label="Send to"></select>
        <select name="type" aria-label="Type"></select>
        <input name="title" placeholder="Title (optional)" aria-label="Title">
      </div>
      <div class="row" id="targets"></div>
      <textarea name="text" placeholder="Message" aria-label="Message"></textarea>
      <div class="row"><button type="submit">Send</button><span id="send-note"></span></div>
    </form>
  </main>
  <div class="handle" id="members-handle" role="separator" aria-orientation="vertical" aria-label="Resize the members panel" tabindex="0" title="Drag to resize, double-click to reset"></div>
  <aside id="members-panel">
    <h2>Members</h2><ul id="members"></ul>
    <div id="agent-detail"></div>
  </aside>
</div>
<script>
"use strict";

// Messages are untrusted: everything is put on the page with textContent, never as HTML.
const ALL = "@all";
const MESSAGE_TYPES = ["message", "request", "question", "answer", "feedback", "bug_report", "feature_request", "status", "ack"];
const REFRESH_MS = 5000;
const PAGE_SIZE = 500;
const STATUS_LABEL = { verified: "verified", unknown_sender: "unknown sender", rejected: "rejected" };

const state = {
  channels: [], agents: [], members: [], status: { can_send: false, note: "" },
  presence: new Map(),            // agent ID -> presence view
  detailAgent: null,              // agent ID whose recent activity is shown
  selected: null,                 // channel ID
  messages: new Map(),            // channel ID -> messages ordered by sequence, once loaded
  unread: new Map(),              // channel ID -> count
  picked: new Set(),              // targets ticked in the composer
};

const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  node.append(...children);
  return node;
}

async function api(path, options) {
  const response = await fetch(path, options);
  if (response.status === 401) showLogin();
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.error || response.statusText);
  }
  return response.json();
}

// ---- layout ----

// The side panels' widths and whether they are shown are kept in this browser. The page works
// without the storage (private window, blocked site data).
const LAYOUT_KEY = "bus-monitor-layout";
const MIN_MAIN_PX = 280;
const PANELS = {
  sidebar: { min: 160, max: 520, fallback: 260, side: 1 },
  members: { min: 140, max: 420, fallback: 220, side: -1 },
};
// Narrow windows start without the members panel.
const layout = { sidebar: PANELS.sidebar.fallback, members: PANELS.members.fallback, sidebarHidden: false, membersHidden: innerWidth < 900 };

try { Object.assign(layout, JSON.parse(localStorage.getItem(LAYOUT_KEY)) || {}); } catch (error) { /* keep the defaults */ }

function applyLayout() {
  const app = $("app");
  for (const name of Object.keys(PANELS)) {
    const hidden = layout[name + "Hidden"];
    app.style.setProperty("--" + name + "-w", layout[name] + "px");
    app.classList.toggle(name + "-hidden", hidden);
    $(name + "-handle").classList.toggle("collapsed", hidden);
    $("toggle-" + name).setAttribute("aria-pressed", String(!hidden));
  }
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch (error) { /* not remembered */ }
}

// A panel may not squeeze the messages below MIN_MAIN_PX or grow past its own maximum.
function clampWidth(name, width) {
  const panel = PANELS[name];
  const other = name === "sidebar" ? "members" : "sidebar";
  const otherUsed = layout[other + "Hidden"] ? 0 : layout[other];
  const room = innerWidth - otherUsed - MIN_MAIN_PX - 2 * 6;
  return Math.round(Math.max(panel.min, Math.min(panel.max, room, width)));
}

for (const [name, panel] of Object.entries(PANELS)) {
  const handle = $(name + "-handle");
  const resize = (width) => { layout[name] = clampWidth(name, width); applyLayout(); };
  handle.addEventListener("pointerdown", (event) => {
    handle.setPointerCapture(event.pointerId);
    handle.classList.add("dragging");
    document.body.classList.add("resizing");
    const startX = event.clientX, startWidth = layout[name];
    const move = (moveEvent) => resize(startWidth + panel.side * (moveEvent.clientX - startX));
    const stop = () => {
      handle.classList.remove("dragging");
      document.body.classList.remove("resizing");
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", stop);
      handle.removeEventListener("pointercancel", stop);
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", stop);
    handle.addEventListener("pointercancel", stop);
  });
  handle.addEventListener("dblclick", () => resize(panel.fallback));
  handle.addEventListener("keydown", (event) => {
    const step = { ArrowLeft: -16, ArrowRight: 16 }[event.key];
    if (step) { event.preventDefault(); resize(layout[name] + panel.side * step); }
  });
  $("toggle-" + name).addEventListener("click", () => { layout[name + "Hidden"] = !layout[name + "Hidden"]; applyLayout(); });
}
addEventListener("resize", () => { for (const name of Object.keys(PANELS)) layout[name] = clampWidth(name, layout[name]); applyLayout(); });
applyLayout();

// ---- login ----

// A 401 from any call brings up the login form and stops the event stream, which the browser
// would otherwise retry forever. Logging in starts the page again.
function showLogin() {
  state.loggedOut = true;
  if (state.source) state.source.close();
  state.source = null;
  state.feedOpen = false;
  $("login-screen").hidden = false;
  document.forms["login-form"].password.focus();
}

document.forms["login-form"].addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = event.target;
  const note = $("login-note");
  note.textContent = "";
  const response = await fetch("/api/v1/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: form.password.value }) });
  if (!response.ok) {
    note.textContent = ((await response.json().catch(() => ({}))).error || response.statusText);
    return;
  }
  form.password.value = "";
  $("login-screen").hidden = true;
  start();
});

$("logout").addEventListener("click", async () => {
  await fetch("/api/v1/logout", { method: "POST" });
  state.messages.clear();
  showLogin();
});

// ---- data ----

async function loadMessages(channelId) {
  const list = [];
  for (let after = 0; ; ) {
    const page = await api(`/api/v1/messages?channel=${encodeURIComponent(channelId)}&after=${after}&limit=${PAGE_SIZE}`);
    list.push(...page);
    if (page.length < PAGE_SIZE) break;
    after = page[page.length - 1].sequence;
  }
  // Messages that arrived by event while the pages loaded are already in the list.
  const known = state.messages.get(channelId) || [];
  for (const message of known) insertMessage(list, message);
  state.messages.set(channelId, list);
}

function insertMessage(list, message) {
  let index = list.length;
  while (index > 0 && list[index - 1].sequence > message.sequence) index--;
  if (index > 0 && list[index - 1].sequence === message.sequence) return false;
  list.splice(index, 0, message);
  return true;
}

async function refresh() {
  if (state.loggedOut) return;
  try {
    let views;
    [state.channels, state.agents, state.status, views] = await Promise.all([api("/api/v1/channels"), api("/api/v1/agents"), api("/api/v1/status"), api("/api/v1/presence")]);
    state.presence = new Map(views.map((view) => [view.agent, view]));
    if (state.selected) state.members = await api(`/api/v1/members?channel=${encodeURIComponent(state.selected)}`).catch(() => []);
  } catch (error) {
    $("live").textContent = "error: " + error.message;
    return;
  }
  showLive();
  $("banner").hidden = state.status.password_set !== false;
  $("logout").hidden = !state.status.password_set;
  renderSidebar();
  renderMembers();
  renderComposer();
}

async function select(channelId) {
  state.selected = channelId;
  state.unread.delete(channelId);
  history.replaceState(null, "", "#" + encodeURIComponent(channelId));
  if (!state.messages.has(channelId)) await loadMessages(channelId);
  await refresh();
  pointComposerAt(state.channels.find((c) => c.id === channelId));
  renderMessages(true);
}

// The composer's target follows the channel that is open: a conversation of the sending agent
// is answered, anything else is posted to the channel itself.
function pointComposerAt(channel) {
  if (!channel) return;
  const target = document.forms.composer.target;
  if (channel.kind === "general") target.value = "group:general";
  else if (channel.kind === "group") target.value = "group:" + channel.name;
  else if (channel.agents.includes(state.status.agent)) target.value = "agent:" + channel.agents.find((id) => id !== state.status.agent);
}

// ---- rendering ----

function describeChannel(channel) {
  return channel.kind === "group" ? "# " + channel.name : channel.kind === "general" ? "# general" : channel.name.replace(" + ", " \u2194 ");
}

// ---- presence ----

// The dot's color class: every error:<kind> state looks the same.
function stateClass(stateName) {
  return stateName.startsWith("error:") ? "error" : stateName;
}

function ago(time) {
  const seconds = Math.max(0, Math.round((Date.now() - new Date(time).getTime()) / 1000));
  if (seconds < 60) return seconds + "s";
  if (seconds < 3600) return Math.floor(seconds / 60) + "m";
  return Math.floor(seconds / 3600) + "h";
}

function presenceOf(agentId) {
  return state.presence.get(agentId) || { agent: agentId, state: "offline" };
}

// The agent's ID with its status dot and state.
function agentLine(agentId, view) {
  return el("span", { class: "agent-line", title: agentId + ": " + view.state },
    el("span", { class: "dot " + stateClass(view.state) }), el("span", { class: "label" }, agentId),
    el("span", { class: "muted state" }, view.state));
}

// "N workers" and what the agent is doing, with how long.
function agentSummary(view) {
  const parts = [];
  if (view.workers && view.workers.length) parts.push(view.workers.length + (view.workers.length === 1 ? " worker" : " workers"));
  if (view.activity) parts.push(view.activity + " (" + ago(view.activity_since) + ")");
  const text = parts.join(" \u00b7 ");
  return parts.length ? el("div", { class: "agent-sub", title: text }, text) : "";
}

function showDetail(agentId) {
  state.detailAgent = agentId;
  renderDetail();
}

function renderDetail() {
  const box = $("agent-detail");
  if (!state.detailAgent) { box.replaceChildren(); return; }
  const view = presenceOf(state.detailAgent);
  const since = view.since ? " for " + ago(view.since) : "";
  const workers = (view.workers || []).map((w) => el("div", { class: "entry" }, w.description + " (" + ago(w.since) + ")"));
  const recent = (view.recent || []).slice().reverse().map((e) => el("div", { class: "entry" }, el("span", { class: "muted" }, ago(e.at) + " ago "), e.text));
  box.replaceChildren(
    el("h2", { class: "cut", title: state.detailAgent }, state.detailAgent),
    el("div", { class: "entry" }, el("span", { class: "dot " + stateClass(view.state) }), view.state + since),
    ...(view.pending ? [el("div", { class: "entry" }, view.pending + " unread targeted")] : []),
    ...(workers.length ? [el("h2", {}, "Workers"), ...workers] : []),
    el("h2", {}, "Recent activity"), ...(recent.length ? recent : [el("div", { class: "entry muted" }, "none")]));
}

function renderSidebar() {
  const channelItems = state.channels.filter((c) => c.kind !== "dm");
  const dmItems = state.channels.filter((c) => c.kind === "dm");
  const item = (channel) => {
    const unread = state.unread.get(channel.id);
    return el("li", { class: "item" + (channel.id === state.selected ? " selected" : ""), title: describeChannel(channel) + (channel.description ? ": " + channel.description : ""), onclick: () => select(channel.id) },
      el("span", { class: "label" }, describeChannel(channel)), unread ? el("span", { class: "unread" }, String(unread)) : "");
  };
  $("channels").replaceChildren(...channelItems.map(item));
  $("dms").replaceChildren(...(dmItems.length ? dmItems.map(item) : [el("li", { class: "empty" }, "none yet")]));
  $("agents").replaceChildren(...(state.agents.length ? state.agents.map((agent) => {
    if (agent.removed) {
      return el("li", { class: "item removed", title: agent.fingerprint },
        el("div", {}, el("span", { class: "agent-line", title: agent.id + " (removed)" }, el("span", { class: "dot" }), el("span", { class: "label" }, agent.id), el("span", { class: "muted state" }, "removed"))));
    }
    const view = presenceOf(agent.id);
    return el("li", { class: "item", title: agent.fingerprint, onclick: () => { document.forms.composer.target.value = "agent:" + agent.id; showDetail(agent.id); } },
      el("div", {}, agentLine(agent.id, view), agentSummary(view)));
  }) : [el("li", { class: "empty" }, "no agents registered")]));
  renderDetail();
}

function renderMembers() {
  $("members").replaceChildren(...(state.members.length ? state.members.map((id) =>
    el("li", { class: "member", onclick: () => showDetail(id) }, agentLine(id, presenceOf(id)))) : [el("li", { class: "empty" }, "none")]));
}

function renderHeader() {
  const channel = state.channels.find((c) => c.id === state.selected);
  const title = channel ? describeChannel(channel) : "Select a channel";
  $("channel-title").textContent = title;
  $("channel-title").title = title;
  $("channel-description").textContent = channel ? channel.description || "" : "";
  $("channel-description").title = channel ? channel.description || "" : "";
}

// "-> recipient" for a direct message (the envelope's to is an agent), "-> #channel" otherwise.
function destination(message) {
  const isDM = message.channel.startsWith("dm:");
  const label = isDM ? message.to : "#" + message.to;
  return el("span", { class: "muted cut", title: label }, "\u2192 " + label);
}

function renderMessage(message, channel) {
  const meta = el("div", { class: "meta" },
    el("span", { class: "from cut", title: message.from || "" }, message.from || "unknown sender"),
    ...(message.to ? [destination(message)] : []),
    el("span", { class: "muted", title: message.time || "" }, message.time ? new Date(message.time).toLocaleString() : ""),
    ...(message.type ? [el("span", { class: "pill" }, message.type)] : []),
    el("span", { class: "badge " + message.status }, STATUS_LABEL[message.status] || message.status),
    el("span", { class: "muted" }, "#" + message.sequence));
  const targets = (message.targets || []).map((target) => {
    const mine = target === state.status.agent;
    return el("span", { class: "pill " + (target === ALL ? "all" : mine ? "me" : "target"), title: target }, target);
  });
  return el("div", { class: "message" }, meta,
    ...(targets.length ? [el("div", { class: "targets-row" }, ...targets)] : []),
    ...(message.title ? [el("div", { class: "title" }, message.title)] : []),
    ...(message.text ? [el("div", { class: "text" }, message.text)] : []),
    ...(message.reason ? [el("div", { class: "reason" }, message.reason)] : []));
}

function renderMessages(scrollToEnd) {
  renderHeader();
  const box = $("messages");
  const atEnd = scrollToEnd || box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const channel = state.channels.find((c) => c.id === state.selected);
  const list = state.messages.get(state.selected) || [];
  box.replaceChildren(...(list.length ? list.map((m) => renderMessage(m, channel)) : [el("div", { class: "empty" }, "No messages yet.")]));
  if (atEnd) box.scrollTop = box.scrollHeight;
}

function renderComposer() {
  const form = document.forms.composer;
  const previous = form.target.value;
  const groups = state.channels.filter((c) => c.kind === "group");
  form.target.replaceChildren(
    el("optgroup", { label: "Channels" }, el("option", { value: "group:general" }, "# general"), ...groups.map((g) => el("option", { value: "group:" + g.name }, "# " + g.name))),
    el("optgroup", { label: "Direct message" }, ...state.agents.filter((a) => a.id !== state.status.agent && !a.removed).map((a) => el("option", { value: "agent:" + a.id }, a.id))));
  form.target.value = previous || "group:general";
  if (!form.target.value) form.target.value = "group:general";
  if (!form.type.options.length) form.type.replaceChildren(...MESSAGE_TYPES.map((type) => el("option", { value: type }, type)));

  renderTargets();
  const canSend = state.status.can_send;
  for (const field of form.elements) field.disabled = !canSend || (field.type === "checkbox" && form.target.value.startsWith("agent:"));
  const note = $("send-note");
  if (!note.classList.contains("error")) {
    note.textContent = canSend ? "Sending as " + state.status.agent : state.status.note;
  }
}

// The picker offers the members of the open channel and @all. A direct message needs none: it
// targets its recipient. Mentions typed in the text are read by the monitor when none is ticked.
function renderTargets() {
  const form = document.forms.composer;
  const isDM = form.target.value.startsWith("agent:");
  const choices = [ALL, ...state.members.filter((id) => id !== state.status.agent)];
  state.picked = new Set([...state.picked].filter((id) => choices.includes(id)));
  $("targets").replaceChildren(el("span", { class: "muted" }, "Aimed at:"), ...choices.map((id) => {
    const box = el("input", { type: "checkbox", value: id, ...(isDM ? { disabled: "" } : {}) });
    box.checked = state.picked.has(id);
    box.addEventListener("change", () => (box.checked ? state.picked.add(id) : state.picked.delete(id)));
    return el("label", { title: id }, box, el("span", {}, id));
  }));
}

// ---- sending ----

document.forms.composer.target.addEventListener("change", renderTargets);
document.forms.composer.addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = event.target;
  const [kind, ...nameParts] = form.target.value.split(":");
  const note = $("send-note");
  note.classList.remove("error");
  try {
    await api("/api/v1/send", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to: { kind, name: nameParts.join(":") }, type: form.type.value, targets: form.target.value.startsWith("agent:") ? [] : [...state.picked], title: form.title.value, text: form.text.value }),
    });
    form.title.value = form.text.value = "";
    state.picked.clear();
    renderTargets();
    note.textContent = "Sent.";
  } catch (error) {
    note.classList.add("error");
    note.textContent = error.message;
    setTimeout(() => { note.classList.remove("error"); renderComposer(); }, 8000);
  }
});

// ---- live feed ----

// The indicator shows this page's event stream and the monitor's own connection to the bus.
function showLive() {
  const busUp = !state.status || state.status.bus === "live";
  $("live").textContent = !state.feedOpen ? "reconnecting..." : busUp ? "live" : "bus disconnected, reconnecting...";
  $("live").className = state.feedOpen && busUp ? "on" : "";
}

function connectEvents() {
  const source = state.source = new EventSource("/api/v1/events");
  source.onopen = async () => {
    state.feedOpen = true;
    showLive();
    // Catch up on what was missed while disconnected.
    state.messages.delete(state.selected);
    if (state.selected) await loadMessages(state.selected);
    await refresh();
    renderMessages(false);
  };
  source.addEventListener("presence", (event) => {
    const view = JSON.parse(event.data);
    state.presence.set(view.agent, view);
    renderSidebar();
    renderMembers();
  });
  // An event stream that fails shows no status code: ask the API, which brings up the login if that is why.
  source.onerror = () => {
    state.feedOpen = false;
    showLive();
    api("/api/v1/status").catch(() => {});
  };
  source.addEventListener("message", async (event) => {
    const message = JSON.parse(event.data);
    if (!state.channels.some((c) => c.id === message.channel)) await refresh();
    const list = state.messages.get(message.channel); // missing until the channel was opened
    if (message.channel === state.selected) {
      if (list && insertMessage(list, message)) renderMessages(false);
    } else {
      if (list) insertMessage(list, message);
      state.unread.set(message.channel, (state.unread.get(message.channel) || 0) + 1);
      renderSidebar();
    }
  });
}

async function start() {
  state.loggedOut = false;
  await refresh();
  if (state.loggedOut) return;
  const wanted = decodeURIComponent(location.hash.slice(1));
  await select(state.channels.some((c) => c.id === wanted) ? wanted : "general");
  connectEvents();
}

start();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
