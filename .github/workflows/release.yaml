# Runs on GitHub Actions.
#   push to main, pull request: make check, then a goreleaser snapshot build (nothing published)
#   tag v*: goreleaser publishes the GitHub release and pushes the image to ghcr.io
#
# Repository variable (optional): IMAGE_NAME, the full image name, default
# ghcr.io/<owner>/agent-messenger. The job's GITHUB_TOKEN creates the release and pushes the image.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # the release
  packages: write # the image on ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser builds the changelog from the tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make check

      - name: Image name
        env:
          IMAGE_NAME_VAR: ${{ vars.IMAGE_NAME }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=${IMAGE_NAME_VAR:-ghcr.io/$owner/agent-messenger}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.20.2
          args: release --clean ${{ startsWith(github.ref, 'refs/tags/v') && ' ' || '--snapshot' }}
