# Runs on GitHub Actions.
#   push to main, pull request: make check, then a goreleaser snapshot build (nothing published)
#   tag v*: goreleaser publishes the GitHub release and pushes the image to ghcr.io; the vsix job then
#           attaches the VS Code extension (vscode/) to that release. It is not published to a marketplace.
#
# Repository variable (optional): IMAGE_NAME, the full image name, default
# ghcr.io/<owner>/agent-messenger. The job's GITHUB_TOKEN creates the release and pushes the image.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # the release
  packages: write # the image on ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser builds the changelog from the tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: make check

      - name: Image name
        env:
          IMAGE_NAME_VAR: ${{ vars.IMAGE_NAME }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=${IMAGE_NAME_VAR:-ghcr.io/$owner/agent-messenger}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.20.2
          args: release --clean ${{ startsWith(github.ref, 'refs/tags/v') && ' ' || '--snapshot' }}

  # Checks and packs the VS Code extension on every run; on a tag it carries the tag's version and
  # goes to the release the release job just made.
  vsix:
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd vscode && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - run: make vsix

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$GITHUB_REF_NAME" vscode/agent-messenger.vsix --clobber
