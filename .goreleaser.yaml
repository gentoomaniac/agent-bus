# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: agent-messenger

before:
  hooks:
    - go mod download

builds:
  # busd runs in the broker's container only, so it is built for linux.
  - id: busd
    main: ./cmd/busd
    binary: busd
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
  - id: agent-busctl
    main: ./cmd/agent-busctl
    binary: agent-busctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
  - id: agent-bus
    main: ./cmd/agent-bus
    binary: agent-bus
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

  - id: bus-monitor
    main: ./cmd/bus-monitor
    binary: bus-monitor
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  # busd runs only in the image (linux), so the archives leave it out: every platform's archive
  # then holds the same binaries.
  - ids: [agent-busctl, agent-bus, bus-monitor]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]

# Releases are published on GitHub.
release:
  github:
    owner: gentoomaniac
    name: agent-bus

# The central components (nats-server, busd, agent-busctl, bus-monitor); the image is multi-arch linux. The registry and
# image name come from the environment: IMAGE_NAME, by default ghcr.io/gentoomaniac/agent-messenger.
dockers_v2:
  - images:
      - "{{ .Env.IMAGE_NAME }}"
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: deploy/Dockerfile
    ids: [busd, agent-busctl, agent-bus, bus-monitor]
    platforms: [linux/amd64, linux/arm64]
    extra_files:
      - deploy/entrypoint.sh
      - deploy/nats-server.conf
